<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Drop in a song and your clips. AutoClip hears the beats and drops, finds the highlights in your footage and cuts a beat-synced edit on its own, in your browser."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Apply the saved look before first paint so there's no flash of the default theme. -->
    <script>
      try {
        const t = localStorage.getItem('autoclip:theme')
        document.documentElement.dataset.theme = ['fight', 'press', 'afterhours'].includes(t) ? t : 'fight'
      } catch {
        document.documentElement.dataset.theme = 'fight'
      }
    </script>
    <title>AutoClip · beat-synced edits, cut for you</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
